[project]
name = "cellresp"
version = "0.1.0"
description = "GDSC2 x DepMap harmonization and statistical baselines for drug-response prediction"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
