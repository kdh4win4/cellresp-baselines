# Source files. URLs are best-known locations; VERIFY each against the portal
# before the first run and record the exact release label you used.
# If a URL fails (or is null), download manually into data/raw/ with the given
# filename; the manifest step records checksums either way.

raw_dir: data/raw
processed_dir: data/processed
reports_dir: reports
results_dir: results

sources:
  gdsc2_response:
    release: "GDSC release 8.5"
    url: "https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/GDSC2_fitted_dose_response_27Oct23.xlsx"
    filename: "GDSC2_fitted_dose_response.xlsx"
  gdsc_compounds:
    release: "GDSC release 8.5"
    url: "https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/screened_compounds_rel_8.5.csv"
    filename: "screened_compounds.csv"
  depmap_model:
    release: "DepMap Public (fill in, e.g. 25Q2)"
    url: null            # download from depmap.org/portal/data_page
    filename: "Model.csv"
  depmap_expression:
    release: "DepMap Public (same release as Model.csv)"
    url: null            # OmicsExpression ... ProteinCoding ... TPMLogp1 file
    filename: "OmicsExpressionProteinCodingGenesTPMLogp1.csv"
  hgnc:
    release: "HGNC complete set (date of download)"
    url: "https://storage.googleapis.com/public-download-files/hgnc/tsv/tsv/hgnc_complete_set.txt"
    filename: "hgnc_complete_set.txt"
    optional: true

harmonize:
  use_pubchem: true          # name -> InChIKey/SMILES via PUG REST (cached)
  pubchem_cache: data/processed/pubchem_cache.json
  require_expression: true   # keep only cell lines with DepMap expression

evaluate:
  target: LN_IC50
  n_folds: 5
  seed: 0
  split_kinds: [random, unseen_drug, unseen_cell]
  min_group_size: 10         # min test rows for per-drug / per-cell correlation
  additive_shrinkage: 0.0    # pseudo-count for cell effects in the additive baseline
