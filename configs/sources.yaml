# Raw sources. Files are downloaded manually into data/raw/ with the
# filenames below; the manifest step records release, size and sha256.

raw_dir: data/raw
processed_dir: data/processed
reports_dir: reports
results_dir: results

sources:
  gdsc2_response:
    release: "GDSC release 8.5 (GDSC2_fitted_dose_response_27Oct23), via Cell Model Passports"
    url: null
    filename: "GDSC2_fitted_dose_response.xlsx"
  gdsc_compounds:
    release: "not downloaded"
    url: null
    filename: "screened_compounds.csv"
    optional: true
  depmap_model:
    release: "DepMap Public 26Q1, downloaded 2026-09-30"
    url: null
    filename: "Model.csv"
  depmap_expression:
    release: "DepMap Public 26Q1, downloaded 2026-09-30 (OmicsExpressionTPMLogp1HumanProteinCodingGenes.csv)"
    url: null
    filename: "OmicsExpressionProteinCodingGenesTPMLogp1.csv"
  hgnc:
    release: "not downloaded"
    url: null
    filename: "hgnc_complete_set.txt"
    optional: true

harmonize:
  use_pubchem: true          # name -> InChIKey/SMILES via PUG REST (cached)
  pubchem_cache: data/processed/pubchem_cache.json
  require_expression: true   # keep only cell lines with DepMap expression

evaluate:
  target: LN_IC50
  n_folds: 5
  seed: 0
  split_kinds: [random, unseen_drug, unseen_cell]
  min_group_size: 10         # min test rows for per-drug / per-cell correlation
  additive_shrinkage: 0.0
  # pseudo-count for cell effects in the additive baseline
